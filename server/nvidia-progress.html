<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NVIDIA generation progress</title>
<style>
:root { --bg: #ffffff; --card: #f5f5f3; --line: #e1e0d9; --ink: #0b0b0b; --muted: #52514e; --faint: #898781; --ok: #2f7d32; --warn: #a86400; --bad: #b3261e; --accent: #2a78d6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #161615; --card: #22221f; --line: #383835; --ink: #f0efec; --muted: #c3c2b7; --faint: #898781; --ok: #6fcf73; --warn: #e6b04d; --bad: #f08a84; --accent: #5aa2ef; } }
:root[data-theme="dark"] { --bg: #161615; --card: #22221f; --line: #383835; --ink: #f0efec; --muted: #c3c2b7; --faint: #898781; --ok: #6fcf73; --warn: #e6b04d; --bad: #f08a84; --accent: #5aa2ef; }
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 980px; margin: 0 auto; }
h1 { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 16px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: middle; }
.dot.off { background: var(--bad); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 12px; }
.card { background: var(--card); border-radius: 12px; padding: 14px 16px; }
.label { font-size: 13px; color: var(--muted); }
.num { font-size: 26px; font-weight: 500; margin-top: 4px; font-variant-numeric: tabular-nums; }
.sec { font-size: 15px; font-weight: 500; margin: 22px 0 8px; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); }
.row { display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(4, minmax(0, 1fr)); gap: 8px; align-items: center; font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.row.head { color: var(--muted); font-size: 13px; }
.ev { display: grid; grid-template-columns: 74px minmax(0, 1fr) minmax(0, 1.3fr); gap: 8px; font-size: 14px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.ok { color: var(--ok); }
.warn { color: var(--warn); }
.bad { color: var(--bad); }
.muted { color: var(--faint); }
.note { font-size: 14px; color: var(--bad); margin: 10px 0; }
@media (max-width: 600px) { .row { grid-template-columns: minmax(0, 1.4fr) repeat(4, minmax(0, 1fr)); font-size: 12px; } .ev { grid-template-columns: 60px minmax(0, 1fr); } .ev > span:last-child { grid-column: 2; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Generation progress</h1>
  <div class="top">
    <span><span class="dot" id="dot"></span><span id="status">Connecting</span> · <span id="engine" class="muted">Engine: checking</span></span>
    <span><span id="updated" class="muted"></span> <button id="reset" type="button" style="margin-left:12px;font:inherit;font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer">Reset counts</button></span>
  </div>
  <div class="grid">
    <div class="card"><div class="label">Questions kept (shown in app)</div><div class="num ok" id="done">0</div></div>
    <div class="card"><div class="label">Dropped by checks</div><div class="num bad" id="failed">0</div></div>
    <div class="card"><div class="label">In progress</div><div class="num" id="inflight">0</div></div>
    <div class="card"><div class="label">Done per minute</div><div class="num" id="rate">0</div></div>
  </div>
  <div class="grid">
    <div class="card"><div class="label">Calls succeeded</div><div class="num ok" id="a-ok">0</div></div>
    <div class="card"><div class="label">Refused (429), retried</div><div class="num warn" id="a-ref">0</div></div>
    <div class="card"><div class="label">Server errors</div><div class="num warn" id="a-err">0</div></div>
    <div class="card"><div class="label">Timeouts (60 s)</div><div class="num bad" id="a-to">0</div></div>
  </div>
  <div class="sec">By model</div>
  <div id="models"></div>
  <div class="sec">Latest events</div>
  <div id="events"></div>
  <div class="note" id="err" hidden></div>
</div>
<script>
const STATS_URL = '/api/ai/nvidia-stats';
const samples = [];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const n = (v) => Number(v || 0).toLocaleString();
function rate() {
  if (samples.length < 2) return 0;
  const a = samples[0], b = samples[samples.length - 1];
  const mins = (b.t - a.t) / 60000;
  if (b.done < a.done) return 0;
  return mins > 0 ? Math.round(((b.done - a.done) / mins) * 10) / 10 : 0;
}
function outcomeClass(o) {
  if (/^ok$|question ok/.test(o)) return 'ok';
  if (/failed|timeout|error/.test(o)) return 'bad';
  if (/refused|stopped/.test(o)) return 'warn';
  return '';
}
function render(d) {
  $('dot').className = 'dot';
  $('status').textContent = d.inFlight > 0 ? 'Generating: ' + n(d.inFlight) + ' calls in progress' : 'Idle';
  $('engine').textContent = d.engine ? 'Engine: ' + d.engine.provider + ' · ' + d.engine.model : 'Engine: none used yet';
  $('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  $('err').hidden = true;
  samples.push({ t: Date.now(), done: d.accepted });
  while (samples.length && Date.now() - samples[0].t > 60000) samples.shift();
  const dropped = Object.entries(d.dropped || {});
  const droppedTotal = dropped.reduce((s, [, c]) => s + c, 0);
  $('done').textContent = n(d.accepted);
  $('failed').textContent = n(droppedTotal);
  $('failed').title = dropped.map(([k, c]) => k + ': ' + c).join('\n');
  $('inflight').textContent = n(d.inFlight);
  $('rate').textContent = rate().toLocaleString();
  $('a-ok').textContent = n(d.attempts.ok);
  $('a-ref').textContent = n(d.attempts.refused);
  $('a-err').textContent = n(d.attempts.error);
  $('a-to').textContent = n(d.attempts.timeout);
  const models = Object.entries(d.byModel);
  const total = models.reduce((s, [, m]) => s + m.ok + m.refused + m.error + m.timeout, 0) || 1;
  $('models').innerHTML = '<div class="row head"><span>Model</span><span>OK</span><span>Refused</span><span>Errors</span><span>Timeouts</span></div>' +
    models.map(([name, m]) => '<div class="row"><span>' + esc(name) + '<div class="bar" style="margin-top:4px"><span style="width:' + Math.round(((m.ok + m.refused + m.error + m.timeout) / total) * 100) + '%"></span></div></span><span class="ok">' + n(m.ok) + '</span><span class="warn">' + n(m.refused) + '</span><span class="warn">' + n(m.error) + '</span><span class="bad">' + n(m.timeout) + '</span></div>').join('') || '<div class="muted" style="font-size:14px">No calls yet.</div>';
  $('events').innerHTML = d.events.map((e) => '<div class="ev"><span class="muted">' + esc(e.at) + '</span><span>' + esc(e.model) + '</span><span class="' + outcomeClass(e.outcome) + '">' + esc(e.outcome) + (e.detail ? ' (' + esc(e.detail) + ')' : '') + '</span></div>').join('') || '<div class="muted" style="font-size:14px">No events yet.</div>';
}
function fail(msg) {
  $('dot').className = 'dot off';
  $('status').textContent = 'No connection';
  $('err').textContent = msg;
  $('err').hidden = false;
}
async function poll() {
  try {
    const res = await fetch(STATS_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    render(await res.json());
  } catch (e) {
    fail('Cannot reach the server (' + (e && e.message ? e.message : 'network error') + '). Check that npm run dev is running, then reload this page.');
  }
}
$('reset').addEventListener('click', async () => {
  try { await fetch('/api/ai/nvidia-stats/reset', { method: 'POST' }); } catch (e) { fail('Could not reset the counts.'); }
  samples.length = 0;
  poll();
});
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
